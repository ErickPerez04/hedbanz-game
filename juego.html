<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partida en Curso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: black; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .game-img { max-width: 100%; max-height: 100vh; object-fit: contain; }
        .game-img.with-controls { max-height: 80vh; }
        .game-controls { position: absolute; bottom: 40px; display: flex; gap: 20px; width: 90%; max-width: 500px; z-index: 10; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
        .btn-success { background: #16a34a; } .btn-success:hover { background: #15803d; }
        .btn-danger { background: #dc2626; } .btn-danger:hover { background: #b91c1c; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <img id="display-image" src="" alt="Imagen de la ronda" class="game-img">
    <div id="admin-controls" class="game-controls hidden">
        <button class="btn-success" onclick="nextRound()">Nueva Ronda</button>
        <button class="btn-danger" onclick="endSession()">Concluir Sesión</button>
    </div>

    <!-- Importación local propia libre de bloqueos de rastreo -->
    <script src="./firebase-app.js"></script>
    <script src="./firebase-database.js"></script>

    <script>
        const datosOcultos = "eyJhcGlLZXkiOiJBSXphU3lEZXI5T1M1aTV6TmdnanVucEFaM2pKRVRIV0M2MVV4Z3MiLCJhdXRoRG9tYWluIjoiaGVkYmFuei1hNjczOC5maXJlYmFzZWFwcC5jb20iLCJkYXRhYmFzZVVSTCI6Imh0dHBzOi8vaGVkYmFuei1hNjczOC1kZWZhdWx0LXJ0ZGIuZmlyZWJhc2Vpby5jb20iLCJwcm9qZWN0SWQiOiJoZWRiYW56LWE2NzM4Iiwic3RvcmFnZUJ1Y2tldCI6ImhlZGJhbnotYTY3MzguZmlyZWJhc2VzdG9yYWdlLmFwcCIsIm1lc3NhZ2luZ1NlbmRlcklkIjoiNzM3MTAyMDU5NzYyIiwiYXBwSWQiOiIxOjczNzEwMjA1OTc2Mjp3ZWI6YTk5ZDk3ZTV1ZmJiZTM2MGI0MThiYiJ9";
        const firebaseConfig = JSON.parse(atob(datosOcultos));
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myImage = sessionStorage.getItem('my_assigned_image');
        const isAdmin = sessionStorage.getItem('game_isAdmin') === 'true';
        const pId = sessionStorage.getItem('game_player_id');

        if (!myImage || !pId) { window.location.href = "./lobby.html"; }

        const imgElement = document.getElementById('display-image');
        imgElement.src = `./img/${myImage}`;

        if (isAdmin) {
            imgElement.classList.add('with-controls');
            document.getElementById('admin-controls').classList.remove('hidden');
        }

        db.ref('gameState').on('value', (snapshot) => {
            const state = snapshot.val();
            if (!state) return;

            if (state.status === 'LOBBY') {
                sessionStorage.removeItem('my_assigned_image');
                window.location.href = "./lobby.html";
            } else if (state.status === 'LOGIN') {
                sessionStorage.clear();
                window.location.href = "./index.html";
            } else if (state.status === 'GAME' && state.assignments && state.assignments[pId]) {
                if (state.assignments[pId] !== myImage) {
                    sessionStorage.setItem('my_assigned_image', state.assignments[pId]);
                    window.location.reload();
                }
            }
        });

        window.nextRound = function() {
            fetch('./imagenes.json').then(res => res.json()).then(IMAGE_POOL_LIST => {
                db.ref('gameState/players').once('value', (snap) => {
                    const playersObj = snap.val() || {};
                    const playersArr = Object.values(playersObj);
                    
                    let shuffledPool = [...IMAGE_POOL_LIST];
                    for (let i = shuffledPool.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffledPool[i], shuffledPool[j]] = [shuffledPool[j], shuffledPool[i]];
                    }
                    let assignments = {};
                    playersArr.forEach((player, index) => {
                        let imgIndex = index % shuffledPool.length;
                        assignments[player.id] = shuffledPool[imgIndex];
                    });
                    
                    db.ref('gameState/assignments').set(assignments);
                });
            });
        }

        window.endSession = function() { 
            db.ref('gameState/status').set('LOGIN'); 
        }
    </script>
</body>
</html>
