<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partida en Curso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: black; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .game-img { max-width: 100%; max-height: 100vh; object-fit: contain; }
        .game-img.with-controls { max-height: 80vh; }
        .game-controls { position: absolute; bottom: 40px; display: flex; gap: 20px; width: 90%; max-width: 500px; z-index: 10; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
        .btn-success { background: #16a34a; } .btn-success:hover { background: #15803d; }
        .btn-danger { background: #dc2626; } .btn-danger:hover { background: #b91c1c; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <img id="display-image" src="" alt="Imagen de la ronda" class="game-img">
    
    <div id="admin-controls" class="game-controls hidden">
        <button class="btn-success" onclick="nextRound()">Nueva Ronda</button>
        <button class="btn-danger" onclick="endSession()">Concluir Sesión</button>
    </div>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script>
        const datosOcultos = "eyJhcGlLZXkiOiJBSXphU3lEZXI5T1M1aTV6TmdnanVucEFaM2pKRVRIV0M2MVV4Z3MiLCJhdXRoRG9tYWluIjoiaGVkYmFuei1hNjczOC5maXJlYmFzZWFwcC5jb20iLCJkYXRhYmFzZVVSTCI6Imh0dHBzOi8vaGVkYmFuei1hNjczOC1kZWZhdWx0LXJ0ZGIuZmlyZWJhc2Vpby5jb20iLCJwcm9qZWN0SWQiOiJoZWRiYW56LWE2NzM4Iiwic3RvcmFnZUJ1Y2tldCI6ImhedWJhbnotYTY3MzguZmlyZWJhc2VzdG9yYWdlLmFwcCIsIm1lc3NhZ2luZ1NlbmRlcklkIjoiNzM3MTAyMDU5NzYyIiwiYXBwSWQiOiIxOjczNzEwMjA1OTc2Mjp3ZWI6YTk5ZDk3ZTV1ZmJiZTM2MGI0MThiYiJ9";
        firebase.initializeApp(JSON.parse(atob(datosOcultos)));
        const db = firebase.database();

        const myImage = sessionStorage.getItem('my_assigned_image');
        const isAdmin = sessionStorage.getItem('game_isAdmin') === 'true';

        if (!myImage) { window.location.href = "./lobby.html"; }

        const imgElement = document.getElementById('display-image');
        imgElement.src = `./img/${myImage}`;

        if (isAdmin) {
            imgElement.classList.add('with-controls');
            document.getElementById('admin-controls').classList.remove('hidden');
        }

        // Escuchar cambios de estado globales
        db.ref('gameState/status').on('value', (snapshot) => {
            const status = snapshot.val();
            if (status === 'LOBBY') {
                sessionStorage.removeItem('my_assigned_image');
                window.location.href = "./lobby.html";
            } else if (status === 'LOGIN') {
                sessionStorage.clear();
                window.location.href = "./index.html";
            }
        });

        // Forzar recarga si el administrador mezcla otra ronda (cambia la asignación pero el estado sigue siendo GAME)
        db.ref('gameState/assignments').on('value', () => {
            // El lobby actualizará las asignaciones en background, redirigimos brevemente para refrescar la foto
            db.ref(`gameState/status`).once('value', (snap) => {
                if(snap.val() === 'GAME') {
                    // Volvemos al lobby un milisegundo para capturar la nueva asignación de forma limpia
                    window.location.href = "./lobby.html";
                }
            });
        });

        function nextRound() { db.ref('gameState/status').set('LOBBY'); }
        function endSession() { db.ref('gameState').set({ status: 'LOGIN' }); }
    </script>
</body>
</html>
