<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Juego</title>
    <style>
        :root {
            --bg-color: #121214; --card-bg: #1a1a1e;
            --primary: #4f46e5; --primary-hover: #4338ca;
            --text: #f3f4f6; --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h1 { margin-bottom: 24px; font-size: 24px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
        input { width: 100%; padding: 12px; border: 1px solid #374151; border-radius: 6px; background: #27272a; color: white; font-size: 16px; }
        input:focus { outline: 2px solid var(--primary); }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; background: var(--primary); color: white; margin-top: 10px; }
        button:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ingresar al Juego</h1>
        <div class="form-group">
            <label for="username">Nombre de Jugador</label>
            <input type="text" id="username" placeholder="Ej. Juan77">
        </div>
        <div class="form-group">
            <label for="password">Contraseña (Solo Admin)</label>
            <input type="password" id="password" placeholder="Dejar vacío si eres jugador">
        </div>
        <button onclick="login()">Entrar al Lobby</button>
    </div>
    <script>
        const ADMIN_PASSWORD_HASH = "YWRtaW4xMDI5Mzg0NzU2";
        function login() {
            const nameInput = document.getElementById('username').value.trim();
            const passInput = document.getElementById('password').value;
            if (!nameInput) { alert("Por favor introduce un nombre de jugador."); return; }
            
            sessionStorage.setItem('game_username', nameInput);
            if (passInput === atob(ADMIN_PASSWORD_HASH)) {
                sessionStorage.setItem('game_isAdmin', 'true');
            } else {
                sessionStorage.setItem('game_isAdmin', 'false');
            }
            window.location.href = "./lobby.html";
        }
    </script>
</body>
</html>
